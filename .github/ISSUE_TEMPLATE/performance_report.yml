name: Performance
description: Report slow loading times, FPS drops, freezes, crashes, or high resource usage.
labels:
  - TOPIC-Performance
body:
  - type: markdown
    attributes:
      value: |
        Please try to fill in as much of the form below as you're able to. Fields marked with an asterisk (*) are required.

  - type: checkboxes
    id: duplicates
    attributes:
      label: Check for duplicates
      options:
        - label: I've checked for duplicate open **and closed** issues by using the search function of the [issue tracker](https://github.com/PaysamiKekW/Jinteia-ticket-system/issues?q=is%3Aissue)
          required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: What type of performance issue are you experiencing?
      options:
        - Lag / Delay
        - Freeze
        - Crash
        - High CPU Usage
        - High Memory Usage
        - Other
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where does the issue happen?
      description: Describe the specific action, screen, or feature where the performance problem occurs.
      placeholder: |
        E.g. opening the inventory, loading a map, using a specific skill, etc.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Happens every time
        - Happens randomly
        - Happens only under heavy load
        - Happens rarely
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can the issue be reproduced?
      description: Please provide clear steps that allow us to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Click ...
        4. Observe the lag/freeze/crash.
    validations:
      required: true

  - type: textarea
    id: system_specs
    attributes:
      label: System specifications
      description: Please provide details about your hardware and operating system.
      placeholder: |
        CPU:
        GPU:
        RAM:
        Operating System:
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, logs, or recordings
      description: Please attach screenshots, videos, profiler captures, crash logs, or other relevant files if available.
      placeholder: In this text area, you can attach files/images (copy paste) directly, or link to them if they're hosted elsewhere instead.
    validations:
      required: false
