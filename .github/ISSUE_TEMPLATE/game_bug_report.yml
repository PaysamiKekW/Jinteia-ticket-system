name: Bug Report
description: Report bugs within the game.
labels:
  - TOPIC-Bug
body:
  - type: markdown
    attributes:
      value: |
        Please try to fill in as much of the form below as you're able to. Fields marked with an asterisk (*) are required.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Check for duplicates
      options:
        - label: I've checked for duplicate open **and closed** issues by using the search function of the [issue tracker](https://github.com/PaysamiKekW/Jinteia-ticket-system/issues?q=is%3Aissue)
          required: true
  - type: textarea
    id: expected
    attributes:
      label: What is supposed to happen?
      description: Please write a clear and concise description of what should happen.
      placeholder: |
        E.g. when I use this skill, the character should do [...].
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What is actually happening?
      description: Please write a clear and concise description of what actually happens.
      placeholder: |
        E.g. When I use this skill, the character does not behave as expected.
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots
      description: Please attach screenshots if you have them. You can also attach other files or link to them if they're hosted elsewhere.
      placeholder: In this text area, you can attach files/images (copy paste) directly, or link to them if they're hosted elsewhere instead.
    validations:
      required: false
