name: Character Balancing Report
description: Report issues with character balancing.
labels:
  - TOPIC-Balancing
body:
  - type: markdown
    attributes:
      value: |
        Please try to fill in as much of the form below as you're able to. Fields marked with an asterisk (*) are required.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Check for duplicates
      options:
        - label: I've checked for duplicate open **and closed** issues by using the search function of the [issue tracker](https://github.com/PaysamiKekW/Jinteia-ticket-system/issues?q=is%3Aissue)
          required: true
  - type: dropdown
    id: character
    attributes:
      label: Which character is this issue about?
      options:
        - Dragon Starfall
        - Dragon Talismans
        - Healer Balls
        - Healer Combo
        - Archer Arrow Rain
        - Archer Chains
        - Dagger Combo
        - Dagger Darts
        - Aura Three-way cut
        - Aura Cyclone
        - Mental Stump
        - Mental Thorns
        - BM Spirit
        - BM Flamefield
        - WP Whirlwind
        - WP Curse
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the character supposed to be doing?
      description: Please write a clear and concise description of what should happen.
      placeholder: |
        E.g. when I increase this stat, the character should do [...].
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What is the character actually doing?
      description: Please write a clear and concise description of what actually happens.
      placeholder: |
        E.g. When I increase this stat, the character does not behave as expected.
        [screenshot].
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots
      description: Please attach screenshots if you have them. You can also attach other files or link to them if they're hosted elsewhere.
      placeholder: In this text area, you can attach files/images (copy paste) directly, or link to them if they're hosted elsewhere instead.
    validations:
      required: false
