name: Assign Character Label

on:
    issues:
        types: [opened, edited]

permissions:
    issues: write

jobs:
    label:
        runs-on: ubuntu-latest

        steps:
            - name: Assign character labels from checkboxes
              uses: actions/github-script@v8
              with:
                  script: |
                      const body = context.payload.issue.body || "";

                      const ALLOWED_PREFIX = "Char-";

                      function toLabel(characterName) {
                      return (
                          ALLOWED_PREFIX +
                          characterName
                          .trim()
                          .replace(/\s+/g, "-")
                          .replace(/\//g, "-")
                      );
                      }

                      const match = body.split("### Which characters are affected?")[1];
                      if (!match) return;

                      const section = match.split("\n###")[0];

                      const checkedItems = [...section.matchAll(/- \[x\] (.+)/g)].map(m => m[1].trim());
                      const labelsToAdd = checkedItems.map(toLabel);

                      if (labelsToAdd.length > 0) {
                        await github.rest.issues.addLabels({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            labels: labelsToAdd
                        });
                      }
